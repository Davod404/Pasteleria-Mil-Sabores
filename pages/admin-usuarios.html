<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Gestión de Usuarios</title>
    <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
    <header>
        <h1>Panel de Administración: Usuarios</h1>
        <nav>
            <a href="../index.html">Ver Tienda</a> | 
            <a href="./admin-productos.html">Gestión de Productos</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear / Modificar Usuario</h2>
            <form>
                <div>
                    <label for="usr-nombre">Nombre:</label>
                    <input type="text" id="usr-nombre">
                </div>
                <div>
                    <label for="usr-email">Correo:</label>
                    <input type="email" id="usr-email">
                </div>
                <div>
                    <label for="usr-rol">Rol:</label>
                    <select id="usr-rol">
                        <option value="cliente">Cliente</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit">Guardar Usuario</button>
            </form>
        </section>

        <section>
            <h2>Usuarios Registrados</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Beneficio Aplicable</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Juan Pérez</td>
                        <td>juan@duocuc.cl</td>
                        <td>Cliente</td>
                        <td>Alumno Duoc UC (Torta gratis)</td>
                        <td>
                            <button type="button">Editar</button>
                            <button type="button">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Panel Administrativo - Pastelería Mil Sabores</p>
    </footer>
</body>
</html>
