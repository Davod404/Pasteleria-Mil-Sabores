<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Pastelería Mil Sabores</title>
    <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
    <header>
        <h1>Contáctanos</h1>
        <nav><a href="../index.html">Inicio</a></nav>
    </header>

    <main>
        <section>
            <h2>Envíanos un mensaje</h2>
            <form id="form-contacto">
                <div id="mensaje-feedback" class="feedback"></div>

                <div class="form-group">
                    <label for="nombre-contacto">Nombre:</label>
                    <input type="text" id="nombre-contacto">
                </div>
                <div class="form-group">
                    <label for="email-contacto">Correo electrónico:</label>
                    <input type="text" id="email-contacto">
                </div>
                <div class="form-group">
                    <label for="motivo">Motivo de contacto:</label>
                    <select id="motivo">
                        <option value="">Selecciona un motivo</option>
                        <option value="consulta">Consulta general</option>
                        <option value="pedido">Estado de pedido / Seguimiento</option>
                        <option value="cotizacion">Cotización para eventos especiales</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" rows="5" style="resize: none;"></textarea>
                </div>
                <button type="submit" class="btn">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pastelería Mil Sabores.</p>
    </footer>
</body>
</html>
